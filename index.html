<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Three WebGPU Cap Shell</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <header>
        <p class="eyebrow">Reusable shell</p>
        <h1>Three.js + WebGPU + Capacitor</h1>
        <p id="status" class="status">booting…</p>
      </header>
      <section class="panel">
        <p class="panel-title">NativeHaptics 测试（需真机 iOS App）</p>
        <div class="row">
          <button type="button" data-haptic="prepare">prepare</button>
          <button type="button" data-haptic="tap">瞬态 tap</button>
          <button type="button" data-haptic="start">持续 start</button>
          <button type="button" data-haptic="update">持续 update</button>
          <button type="button" data-haptic="stop">持续 stop</button>
        </div>
        <p id="haptic-log" class="log">web 预览无震动；Xcode 真机可测 Core Haptics</p>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
