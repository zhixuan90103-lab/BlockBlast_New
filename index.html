<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Block Blast</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="letterbox">
      <div id="phone-frame">
        <div id="stage" aria-hidden="true"></div>
        <div id="hud">
          <header class="game-header">
            <div class="score-center">
              <div class="main-score" data-game-score aria-label="score">0</div>
            </div>
            <p id="status" class="status status-debug" hidden></p>
            <p class="phase" data-game-phase hidden>M2</p>
          </header>

          <div class="game-over" data-game-over hidden aria-hidden="true">
            <div class="game-over-card">
              <p class="game-over-title">Game Over</p>
              <p class="game-over-score">
                Score <span data-final-score>0</span>
              </p>
              <button type="button" class="restart-btn" data-restart>Play Again</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
